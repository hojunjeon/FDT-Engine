# 프로필 C: 프리랜서 충동형. 불규칙 입금, 주말 소비 배수 큼, 탄력도가 1을
# 넘어 예산이 빠듯할수록 오히려 소비가 늘어난다. 돌발 지출 잦음. 체크성
# 소비가 잔액 부족으로 자주 거절된다(declined_debits). FORECAST 밴드 폭,
# OPTIMIZE 검증용.
name: C_impulsive
description: 프리랜서 불규칙 입금(월 2~4회), 주말 소비 폭증, 탄력도 1.4, 돌발 잦음.

accounts:
  - id: 10
    alias: 입출금통장
    is_income: true
    opening_balance: 30000
    managed: true

cards:
  - id: 20
    alias: 체크카드
    kind: CREDIT
    withdrawal_weekday: 3
    withdrawal_account_id: 10

income:
  type: IRREGULAR
  day_of_month: null
  amount: 900000
  jitter_sigma: 0.4
  median_gap_days: 10

fixed_expenses:
  - id: 40
    name: 통신비
    expense_type: TELECOM
    amount: 45000
    is_variable: false
    payment_day: 5
    withdrawal_account_id: 10
    card_id: null

