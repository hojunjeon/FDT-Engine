hidden:
  payday_boost: 1.4
  pre_payday_damp: 1.0
  # 봉투별 탄력도 (리뷰 N4, SPEC S24). 유연 봉투는 대표값(1.4) 부근, 필수
  # 봉투는 1.0 에 가깝게 둔다.
  elasticity:
    외식: 1.4
    교통비: 1.0
    의료·건강: 1.0
    취미·여가: 1.4
    쇼핑: 1.4
    편의점·마트·잡화: 1.0
