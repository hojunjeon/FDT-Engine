spending:
  # S61(리뷰 20260907_W6_W10 §11): 완결 월 잉여 분산을 줄이기 위해 봉투별
  # daily_rate 를 2배로 올리고 amount_mu 를 ln(2) 만큼 낮췄다(기대 지출
  # 총액은 유지, 복합 포아송-로그정규 합의 상대표준편차만 1/sqrt(2) 로
  # 줄어든다). daily_rate 를 realism 이 깨질 정도로(예: 8배 이상) 올리면
  # σ ≤ 9만을 확실히 만족하지만 봉투당 하루 10건대의 거래는 개인 소비
  # 패턴으로 비현실적이라 채택하지 않았다(측정치는 보고 참조, 잔여 분산은
  # 목표 대비 초과).
  외식:
    daily_rate: 2.6
    amount_mu: 8.4669
    amount_sigma: 0.35
    card_share: 0.6
    weekday_mult: [0.95, 0.95, 1.0, 1.0, 1.05, 1.15, 1.05]
  교통비:
